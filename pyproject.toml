[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-jail"
version = "0.2.0"
description = "Shelby County jail observations and aggregate dashboard"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1", "beautifulsoup4==4.15.0", "lxml==6.1.3",
  "Flask==3.1.3", "matplotlib==3.11.2", "xlrd==2.0.2",
  "google-cloud-storage==3.14.1", "waitress==3.0.2",
  "filelock==4.0.1", "tzdata==2026.4"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
sc-jail = "sc_jail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc_jail = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
